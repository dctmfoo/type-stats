name: release

# Push a tag such as v0.2.0 to publish a release: build a universal TypeStats.app, sign it with
# a Developer ID certificate, notarize and staple it, attach the zip and the Homebrew cask to the
# GitHub release, then update the cask in the tap repository.
#
# Repository secrets:
#   DEVELOPER_ID_APP_CERT_P12_BASE64   base64 of the exported "Developer ID Application" .p12
#   DEVELOPER_ID_APP_CERT_PASSWORD     password of that .p12
#   DEVELOPER_ID_APP_SIGNING_IDENTITY  e.g. "Developer ID Application: Your Name (TEAMID)"
#   BUILD_KEYCHAIN_PASSWORD            any random string for the temporary CI keychain
#   APPLE_ID                           Apple ID used for notarization
#   APPLE_APP_SPECIFIC_PASSWORD        app-specific password for that Apple ID
#   APPLE_TEAM_ID                      the Developer team id
#   HOMEBREW_TAP_TOKEN                 optional: a token that can push to the tap repository
#                                      (fine-grained, Contents read and write on that repo only).
#                                      Without it the cask is only attached to the release.
# Repository variable (optional): HOMEBREW_TAP_REPO, default <owner>/homebrew-type-stats.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v (the tag v<version> must exist)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Resolve version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$INPUT_VERSION"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "Version must look like 1.2 or 1.2.3, got '$VERSION'" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          ref: v${{ steps.version.outputs.version }}

      - name: Import Developer ID certificate
        shell: bash
        env:
          DEVELOPER_ID_APP_CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_APP_CERT_P12_BASE64 }}
          DEVELOPER_ID_APP_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_APP_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.BUILD_KEYCHAIN_PASSWORD }}
        run: |
          if [[ -z "${DEVELOPER_ID_APP_CERT_P12_BASE64:-}" || -z "${DEVELOPER_ID_APP_CERT_PASSWORD:-}" || -z "${KEYCHAIN_PASSWORD:-}" ]]; then
            echo "Missing signing secrets. Configure DEVELOPER_ID_APP_CERT_P12_BASE64, DEVELOPER_ID_APP_CERT_PASSWORD and BUILD_KEYCHAIN_PASSWORD." >&2
            exit 1
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/typestats-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/developer-id-app.p12"
          echo "$DEVELOPER_ID_APP_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$DEVELOPER_ID_APP_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$CERT_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Store notarytool credentials
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -z "${APPLE_ID:-}" || -z "${APPLE_APP_SPECIFIC_PASSWORD:-}" || -z "${APPLE_TEAM_ID:-}" ]]; then
            echo "Missing notarization secrets. Configure APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID." >&2
            exit 1
          fi
          xcrun notarytool store-credentials "typestats-notary" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD"

      - name: Package release
        env:
          DEVELOPER_ID_APP_SIGNING_IDENTITY: ${{ secrets.DEVELOPER_ID_APP_SIGNING_IDENTITY }}
          NOTARYTOOL_KEYCHAIN_PROFILE: typestats-notary
          TYPESTATS_REQUIRE_NOTARIZATION: "1"
        run: sh scripts/package-release.sh "${{ steps.version.outputs.version }}" "${{ github.run_number }}"

      - name: Create or update the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v$VERSION"
          DIR="dist/releases/$VERSION"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --verify-tag --title "TypeStats $VERSION" \
              --notes "Signed and notarized universal build. Install with \`brew install --cask ${GITHUB_REPOSITORY_OWNER}/type-stats/type-stats\` or download TypeStats-$VERSION.zip."
          gh release upload "$TAG" "$DIR/TypeStats-$VERSION.zip" "$DIR/TypeStats-$VERSION.sha256" "$DIR/type-stats.rb" --clobber

      - name: Update the Homebrew tap
        shell: bash
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO || format('{0}/homebrew-type-stats', github.repository_owner) }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ -z "${TAP_TOKEN:-}" ]]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not set: copy type-stats.rb from the release into $TAP_REPO/Casks/ by hand."
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" "$RUNNER_TEMP/tap"
          mkdir -p "$RUNNER_TEMP/tap/Casks"
          cp "dist/releases/$VERSION/type-stats.rb" "$RUNNER_TEMP/tap/Casks/type-stats.rb"
          cd "$RUNNER_TEMP/tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/type-stats.rb
          if git diff --cached --quiet; then
            echo "The tap already has type-stats $VERSION."
            exit 0
          fi
          git commit -m "type-stats $VERSION"
          git push origin HEAD

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: typestats-release-${{ steps.version.outputs.version }}
          path: dist/releases/${{ steps.version.outputs.version }}/*.*
