name: build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  swift:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Bundle the app (ad hoc signed)
        run: TYPESTATS_SIGN_IDENTITY=- sh scripts/bundle-app.sh
      - name: Launch smoke (empty store, no event tap)
        run: |
          mkdir -p "$RUNNER_TEMP/typestats-data"
          .build/TypeStats.app/Contents/MacOS/TypeStats --data-dir "$RUNNER_TEMP/typestats-data" --no-tap --dump-counts
